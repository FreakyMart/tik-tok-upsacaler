<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Explainer Studio — renderer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Headless page driven by studio.py (Playwright) for snapshots and MP4 export.
import { Engine } from './engine/core.js';

const canvas = document.getElementById('c');
let engine = null;

window.renderer = {
  async init(name, scale = 1) {
    const project = await fetch(`/api/project/${encodeURIComponent(name)}`).then((r) => {
      if (!r.ok) throw new Error(`project "${name}" not found`);
      return r.json();
    });
    engine = new Engine(canvas, { mode: 'render', scale });
    await engine.load(project, { name });
    const tl = engine.timeline();
    return {
      duration: tl.duration,
      fps: engine.fps,
      width: canvas.width,
      height: canvas.height,
      webgl: !!engine.trans.gl,
      missing: [...engine.assets.missing],
      scenes: tl.items.map((it) => ({ id: it.scene.id, start: it.start, end: it.end })),
      audio: engine.audioPlan(),
    };
  },

  async frame(t, format = 'jpeg', quality = 0.94) {
    await engine.prepare(t);
    engine.render(t);
    return canvas.toDataURL(format === 'png' ? 'image/png' : 'image/jpeg', quality).split(',')[1];
  },

  // A grid of frames in one image so the whole video can be reviewed at a glance.
  async sheet(times, cols = 4, thumbW = 480) {
    const thumbH = Math.round((thumbW * canvas.height) / canvas.width);
    const rows = Math.ceil(times.length / cols);
    const pad = 8, label = 28;
    const out = document.createElement('canvas');
    out.width = cols * (thumbW + pad) + pad;
    out.height = rows * (thumbH + pad + label) + pad;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, out.width, out.height);
    for (let i = 0; i < times.length; i++) {
      await engine.prepare(times[i]);
      engine.render(times[i]);
      const x = pad + (i % cols) * (thumbW + pad);
      const y = pad + Math.floor(i / cols) * (thumbH + pad + label);
      ctx.drawImage(canvas, x, y + label, thumbW, thumbH);
      const it = engine.activeAt(times[i]).at(-1);
      ctx.fillStyle = '#ddd';
      ctx.font = '600 18px monospace';
      ctx.fillText(`${times[i].toFixed(2)}s  ${it ? it.scene.id : ''}`, x + 4, y + 20);
    }
    return out.toDataURL('image/png').split(',')[1];
  },
};
window.rendererReady = true;
</script>
</body>
</html>
